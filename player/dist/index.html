<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RE 动画研究室 · Leon</title><link rel="stylesheet" href="style.css">
<body><header><div><span class="eyebrow">RE ENGINE / MOTION STUDY</span><h1>里昂 · 手枪动作</h1></div><div class="header-links"><a class="technical-link" href="technical.html">技术实现说明 ↗</a><span class="badge">ch0100 <b>灰模预览 v2</b></span></div></header>
<main><aside><div class="section">动作库 <span>14 CLIPS</span></div><label class="sr" for="search">搜索动作</label><input id="search" placeholder="搜索名称或编号…"><div id="clips"></div><div class="note">来自本机包体的真实 MOT 轨道。<br>已加载身体灰模 · 暂无贴图、武器和 IK。</div></aside>
<section class="workspace"><div class="viewport"><canvas id="view" aria-label="三维骨骼动画视图"></canvas><div class="overlay"><span id="kind">原始片段</span><h2 id="title"></h2><div id="subtitle"></div></div><div class="viewtools"><button id="reset">重置视角</button><button id="front">正面</button><button id="side">侧面</button></div><div class="legend"><span style="color:#f5b66b">● 左侧</span><span style="color:#73c9f3">● 右侧</span><span style="color:#d9e4e9">● 中轴</span></div><div class="hint">拖动旋转 · 滚轮缩放 · 空格播放 / 暂停</div></div>
<div class="transport"><div class="playrow"><button id="prev" title="上一帧">−1 帧</button><button id="play" class="primary">暂停</button><button id="next" title="下一帧">+1 帧</button><output id="time"></output><label>速度 <select id="speed"><option value=".25">0.25×</option><option value=".5">0.5×</option><option selected value="1">1×</option><option value="2">2×</option></select></label><label><input type="checkbox" id="loop" checked>循环</label></div><input id="timeline" type="range" min="0" max="1" step="0.001" value="0" aria-label="动画时间轴"><div class="options"><label><input type="checkbox" id="follow" checked>跟随根节点</label><label><input type="checkbox" id="fingers" checked>显示手指</label><label><input type="checkbox" id="names">显示骨骼名称</label><label><input type="checkbox" id="helpers">辅助骨</label><label>范围着色 <select id="mask"><option value="0">左右侧</option><option value="2">Mask2 换弹</option><option value="4">Mask4 抬枪</option><option value="11">Mask11 补偿</option></select></label><label>显示 <select id="displayMode"><option value="model">身体灰模</option><option value="both">灰模＋骨架</option><option value="skeleton">骨架</option></select></label><label><input type="checkbox" id="wireframe">线框</label><label><input type="checkbox" id="bindpose">绑定姿态</label><span id="counts"></span></div></div>
<div class="details"><div><span class="eyebrow">SOURCE / 可追溯资源</span><p id="source"></p></div><p id="warning"></p></div></section></main>
<script src="motions.js"></script><script src="masks.js"></script><script src="math.js"></script><script src="vendor/three.min.js"></script><script src="model.js"></script><script src="model-view.js"></script><script src="app.js"></script></body></html>
