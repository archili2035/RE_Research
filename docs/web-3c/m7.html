<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>M7 路线回放与调参</title>
  <link rel="icon" href="data:," />
  <script type="module" crossorigin src="./assets/m7-BH1T3wXb.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="./assets/clip-manifest-CJJLpKin.js">
  <link rel="modulepreload" crossorigin href="./assets/simulation-DL0xBKIP.js">
  <link rel="stylesheet" crossorigin href="./assets/m7-BNF_7KfW.css">
</head>
<body>
  <main class="layout">
    <header>
      <h1>路线回放与调参</h1>
      <p>试玩关卡 test-room@1 · 固定 60 Hz</p>
      <p>版本 <code data-build-id>48fc8641aabf</code></p>
    </header>
    <section class="replay" aria-label="固定路线">
      <div class="toolbar">
        <button id="play" type="button" disabled>播放</button>
        <button id="step" type="button" disabled>单步</button>
        <button id="reset" type="button" disabled>重置</button>
        <progress id="progress" aria-label="回放进度" value="0"></progress>
        <output id="status" role="status">正在加载物理场景…</output>
      </div>
      <div class="route-grid">
        <div>
          <canvas id="route-map" width="680" height="420" aria-label="测试场、角色轨迹和镜头位置俯视图"></canvas>
          <p class="legend">青色为角色及其轨迹，黄色为当前镜头。</p>
        </div>
        <div class="telemetry">
          <h2>当前模拟步</h2>
          <pre id="snapshot"></pre>
          <h2>事件 <small>按模拟步排序</small></h2>
          <pre id="events">等待回放</pre>
          <button id="download-trace" type="button" disabled>下载已回放轨迹</button>
        </div>
      </div>
    </section>
    <section class="parameters" aria-label="手感参数">
      <h2>手感参数</h2>
      <p>应用后从起点重放。当前参数均来自网页灰盒调试。</p>
      <form id="feel">
        <div id="parameter-groups"></div>
        <div class="toolbar">
          <button type="submit" disabled>应用参数</button>
          <button id="download-feel" type="button" disabled>下载当前参数</button>
          <output id="feel-version"></output>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
